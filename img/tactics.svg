<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
<style>
.pitch{stroke-opacity:.10;stroke-width:2}
.mark{stroke-opacity:.30;stroke-width:2.5;opacity:.35;animation:pulse var(--d,8s) ease-in-out var(--delay,0s) infinite}
.play path,.play polygon{stroke-opacity:.3;stroke-width:2.5}
.play .line{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw 14s ease-in-out var(--delay,0s) infinite}
.play .head{opacity:0;animation:head 14s ease-in-out var(--delay,0s) infinite}
.ball{stroke:#3fbf8f;stroke-width:3.5;stroke-opacity:.8;opacity:0;animation:head 14s ease-in-out var(--delay,0s) infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}4%{opacity:1}30%{stroke-dashoffset:0}72%{opacity:1;stroke-dashoffset:0}86%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes head{0%,28%{opacity:0}33%,72%{opacity:1}86%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
.mark,.play .line,.play .head,.ball{animation:none;opacity:.6;stroke-dashoffset:0}
}
</style>
