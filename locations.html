    (function () {
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      var type = nav ? nav.type : (performance.navigation && performance.navigation.type === 1 ? "reload" : "navigate");
      var fromSite = false;
      try { fromSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      if (type === "reload" || (type === "navigate" && !fromSite)) {
        location.replace("index.html");
        return;
      }
      document.documentElement.classList.add("js", "pre-type");
      setTimeout(function () { document.documentElement.classList.remove("pre-type"); }, 2000);
    })();
